<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR FORM - 元素覺醒</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}

#video {
  display: none;
}

/* 右下角全身預覽小畫面 */
#previewContainer {
  position: fixed;
  z-index: 20;
  bottom: 30px;
  right: 30px;
  width: 220px;
  height: 140px;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.8);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  background: #000;
  display: none;
}

#previewVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

/* 左上角固定容形標誌（超大、無框） */
#fixedLogo {
  position: fixed;
  z-index: 15;
  top: 40px;
  left: 40px;
  display: flex;
  align-items: center;
}

#fixedLogo img {
  height: 220px;
  max-width: 700px;
  object-fit: contain;
}

#fixedLogo .logo-text {
  font-size: 110px;
  font-weight: 900;
  letter-spacing: 10px;
  color: #fff;
  text-shadow: 0 4px 30px rgba(0,0,0,0.9);
}

/* 控制面板 */
#controlPanel {
  position: fixed;
  z-index: 20;
  top: 40px;
  right: 40px;
}

button {
  padding: 16px 32px;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  backdrop-filter: blur(5px);
  transition: all 0.2s;
}

button:hover { background: rgba(255, 255, 255, 0.3); }

/* 狀態提示 */
#status {
  position: fixed;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  letter-spacing: 3px;
  text-align: center;
  width: 90%;
  pointer-events: none;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  background: rgba(0, 0, 0, 0.75);
  padding: 16px 35px;
  border-radius: 40px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(8px);
  z-index: 15;
}

/* 結算畫面：全白背景 */
#result {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.98);
  color: #111;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(15px);
}

.result-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #ffffff;
  padding: 30px 50px;
  border-radius: 20px;
  border: 1px solid rgba(0, 0, 0, 0.15);
  box-shadow: 0 25px 60px rgba(0,0,0,0.15);
  animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  max-width: 1100px;
  width: 95%;
  text-align: center;
}

@keyframes fadeIn {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* 中間證件照 */
.id-photo-container {
  width: 180px;
  height: 230px;
  border-radius: 10px;
  overflow: hidden;
  background: #f0f0f0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  margin-bottom: 15px;
}

.id-photo-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.result-title {
  margin-bottom: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 屬性標誌（極致超大化） */
.attribute-badge-container {
  display: flex;
  align-items: center;
  gap: 25px;
  background: rgba(0, 0, 0, 0.05);
  padding: 16px 50px;
  border-radius: 60px;
  border: 3px solid rgba(0, 0, 0, 0.12);
}

.attribute-badge-img {
  width: 140px;
  height: 140px;
  object-fit: contain;
}

.attribute-badge-text {
  font-size: 75px;
  letter-spacing: 6px;
  font-weight: 900;
  color: #111;
}

.result-desc {
  font-size: 17px;
  color: #444;
  line-height: 1.5;
  margin-bottom: 20px;
  max-width: 850px;
}

/* 最後一幕底部資訊區 */
.result-bottom-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
  border-top: 1px solid rgba(0, 0, 0, 0.15);
  padding-top: 15px;
}

.result-logo-small {
  height: 100px;
  max-width: 400px;
  object-fit: contain;
}

.exhibition-info {
  text-align: center;
  font-size: 13px;
  color: #666;
  line-height: 1.5;
  letter-spacing: 1px;
}

.countdown-tip {
  margin-top: 10px;
  font-size: 13px;
  color: #888;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<!-- 左上角固定容形標誌（超大版） -->
<div id="fixedLogo">
  <img id="logoImg" alt="容形 Logo" style="display:none;">
  <span id="logoText" class="logo-text" style="color:#000;">容形</span>
</div>

<!-- 右下角全身預覽小畫面 -->
<div id="previewContainer">
  <video id="previewVideo" autoplay playsinline muted></video>
</div>

<!-- 控制面板 -->
<div id="controlPanel">
  <button onclick="startSystem()">啟動系統</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="status">請點擊「啟動系統」開始</div>

<!-- 結算畫面（全白背景） -->
<div id="result">
  <div class="result-content">
    <div class="id-photo-container">
      <img id="resultAvatar" alt="ID Photo">
    </div>
    
    <div class="result-title">
      <div class="attribute-badge-container">
        <img id="attributeBadgeImg" class="attribute-badge-img" alt="Icon">
        <span id="attributeBadgeText" class="attribute-badge-text">--</span>
      </div>
    </div>
    <div class="result-desc" id="resultDesc">正在解析屬性說明...</div>
    
    <div class="result-bottom-row">
      <!-- 英文系所上方的容形標誌 -->
      <img id="resultLogoSmall" class="result-logo-small" alt="容形標誌" style="display:none;">
      <span id="resultLogoTextSmall" style="font-weight:bold; font-size:35px; color:#111; display:none;">容形</span>
      
      <div class="exhibition-info">
        <strong>2027 FORMA Graduation Exhibition</strong><br>
        Department of Visual Communication Design<br>
        College of Creative Media Kun Shan University
      </div>
    </div>
    
    <div class="countdown-tip" id="countdownTip">畫面將於 10 秒後自動返回...</div>
  </div>
</div>

<script type="module">
import {
  FilesetResolver,
  FaceLandmarker,
  PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const previewVideo = document.getElementById("previewVideo");

// 容形標誌設定
const logoInfo = { name: "容形", path: "images/rongxing_logo.png" };
const globalLogoImg = new Image();
globalLogoImg.src = logoInfo.path;
globalLogoImg.onload = () => {
  document.getElementById("logoImg").src = logoInfo.path;
  document.getElementById("logoImg").style.display = "block";
  document.getElementById("logoText").style.display = "none";

  document.getElementById("resultLogoSmall").src = logoInfo.path;
  document.getElementById("resultLogoSmall").style.display = "block";
  document.getElementById("resultLogoTextSmall").style.display = "none";
};
globalLogoImg.onerror = () => {
  document.getElementById("logoImg").style.display = "none";
  document.getElementById("logoText").style.display = "block";

  document.getElementById("resultLogoSmall").style.display = "none";
  document.getElementById("resultLogoTextSmall").style.display = "block";
};

// 八個基礎元素設定
const baseElementsInfo = [
  { name: "天", desc: "至高意志與無垠蒼穹，具備統御大局的宏觀視野。", path: "images/天.png" },
  { name: "地", desc: "沉穩厚重與堅毅本質，擁有最強大的防守與包容力。", path: "images/地.png" },
  { name: "山", desc: "不動如山與堅定不移，意志力如磐石般不可動搖。", path: "images/山.png" },
  { name: "澤", desc: "滋潤萬物與靈活應變，擁有極佳的溝通與環境適應力。", path: "images/澤.png" },
  { name: "水", desc: "上善若水與深邃智慧，動靜自如、海納百川。", path: "images/水.png" },
  { name: "火", desc: "狂熱爆發與光明希望，擁有無與倫比的強大行動力。", path: "images/火.png" },
  { name: "雷", desc: "迅雷不及掩耳的決斷與破壞力，直覺敏銳果決。", path: "images/雷.png" },
  { name: "風", desc: "自由無拘與疾速變化，思維靈敏且飄忽不定。", path: "images/風.png" }
];

baseElementsInfo.forEach(el => {
  const img = new Image();
  img.src = el.path;
  img.onload = () => { el.img = img; };
  img.onerror = () => { el.img = null; };
});

let elements = [];
let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

function initParticles() {
  elements = [];
  baseElementsInfo.forEach(info => {
    for (let i = 0; i < 10; i++) {
      elements.push({
        name: info.name,
        desc: info.desc,
        img: info.img,
        size: 180,
        x: Math.random() * (W + 400) - 200,
        y: Math.random() * (H + 400) - 200,
        angle: Math.random() * Math.PI * 2,
        speedX: (Math.random() - 0.5) * 12,
        speedY: (Math.random() - 0.5) * 12,
        rotation: (Math.random() - 0.5) * 0.08,
        progress: 0
      });
    }
  });
}
initParticles();

window.addEventListener("resize", () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

let faceLandmarker;
let poseLandmarker;
let cameraStream;
let phase = "intro";
let introTimer = null;
let currentIntroIndex = 0;
let floatingStartTime = null;
let holdStartTime = null;
let pauseStartTime = null;
let autoResetTimer = null;
let capturedPose = null;
let frozenVideoSnapshot = null;
let latestFaceBox = null;
let isAiLoaded = false;

async function loadAI() {
  if (isAiLoaded) return;
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  isAiLoaded = true;
}

window.startSystem = async function() {
  try {
    document.getElementById("controlPanel").style.display = "none";
    setStatus("系統載入中...");
    await loadAI();
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: 1280, height: 720 },
      audio: false
    });
    video.srcObject = cameraStream;
    previewVideo.srcObject = cameraStream;
    await video.play();
    await previewVideo.play();

    document.getElementById("previewContainer").style.display = "block";

    phase = "intro";
    if (introTimer) clearInterval(introTimer);
    introTimer = setInterval(() => {
      currentIntroIndex = (currentIntroIndex + 1) % baseElementsInfo.length;
    }, 100);

    requestAnimationFrame(loop);
  } catch (error) {
    alert("攝影機啟動失敗：" + error.message);
    document.getElementById("controlPanel").style.display = "block";
    setStatus("請點擊「啟動系統」開始");
  }
};

function isFullBodyInFrame(pose) {
  if (!pose || pose.length < 33) return false;
  const nose = pose[0];
  const leftAnkle = pose[27];
  const rightAnkle = pose[28];
  
  const isHeadVisible = nose.y > 0.05 && nose.y < 0.95 && nose.x > 0.1 && nose.x < 0.9;
  const areFeetVisible = (leftAnkle.visibility > 0.6 && leftAnkle.y < 0.98) && 
                         (rightAnkle.visibility > 0.6 && rightAnkle.y < 0.98);
                         
  return isHeadVisible && areFeetVisible;
}

function loop() {
  ctx.clearRect(0, 0, W, H);

  let pose = null;
  if (video.readyState >= 2 && isAiLoaded) {
    try {
      const now = performance.now();
      const faceResult = faceLandmarker.detectForVideo(video, now);
      if (faceResult?.faceLandmarks?.length > 0) {
        const face = faceResult.faceLandmarks[0];
        let minX = 1, maxX = 0, minY = 1, maxY = 0;
        face.forEach(pt => {
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.y > maxY) maxY = pt.y;
        });
        latestFaceBox = {
          x: (1 - maxX) * W,
          y: minY * H,
          w: (maxX - minX) * W,
          h: (maxY - minY) * H
        };
      }

      const poseResult = poseLandmarker.detectForVideo(video, now);
      if (poseResult?.landmarks?.length > 0) pose = poseResult.landmarks[0];
    } catch (e) {
      console.error(e);
    }
  }

  if (phase === "intro") {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2, H / 2 - 40);
    const currentAttr = baseElementsInfo[currentIntroIndex];
    
    if (currentAttr.img && currentAttr.img.complete && currentAttr.img.naturalWidth !== 0) {
      ctx.drawImage(currentAttr.img, -180, -180, 360, 360);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, 180, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 100px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(currentAttr.name, 0, 0);
    }
    ctx.restore();

    if (isFullBodyInFrame(pose)) {
      if (introTimer) clearInterval(introTimer);
      phase = "floating";
      floatingStartTime = Date.now();
    } else {
      setStatus("請將臉部與雙腳正面對準鏡頭，確保全身完整入鏡（參考右下角小畫面）");
    }

    requestAnimationFrame(loop);
    return;
  }

  if (phase === "floating") {
    if (video.readyState >= 2) {
      ctx.save();
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, W, H);
      ctx.restore();
      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.fillRect(0, 0, W, H);
    }
  } else if (frozenVideoSnapshot) {
    ctx.drawImage(frozenVideoSnapshot, 0, 0, W, H);
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    ctx.fillRect(0, 0, W, H);
  }

  if (phase === "floating") {
    const elapsed = (Date.now() - floatingStartTime) / 1000;
    const remain = Math.max(0, Math.ceil(5 - elapsed));
    
    if (remain > 0) {
      setStatus(`請擺出最符合自己個性的姿勢... ${remain}s`);
    }

    if (elapsed >= 5) {
      capturedPose = pose;

      document.getElementById("previewContainer").style.display = "none";

      const snap = document.createElement("canvas");
      snap.width = W;
      snap.height = H;
      const sctx = snap.getContext("2d");
      sctx.save();
      sctx.translate(W, 0);
      sctx.scale(-1, 1);
      sctx.drawImage(video, 0, 0, W, H);
      sctx.restore();
      frozenVideoSnapshot = snap;

      attractParticlesToBody(pose);
      phase = "flying";
    }
  }

  if (phase === "flying") {
    setStatus("元素融合中...");
    const finished = elements.every(el => el.progress >= 1);
    if (finished) {
      phase = "pause";
      pauseStartTime = Date.now();
    }
  }

  if (phase === "pause") {
    setStatus("覺醒凝聚...");
    const pauseElapsed = (Date.now() - pauseStartTime) / 1000;
    if (pauseElapsed >= 1.0) {
      phase = "result";
      showResult();
    }
  }

  if (phase === "floating" || phase === "flying" || phase === "pause") {
    elements.forEach(el => {
      const matched = baseElementsInfo.find(b => b.name === el.name);
      if (matched && matched.img) el.img = matched.img;

      if (phase === "floating") {
        el.x += el.speedX;
        el.y += el.speedY;
        el.angle += el.rotation;

        if (el.x < -300) el.x = W + 300;
        if (el.x > W + 300) el.x = -300;
        if (el.y < -300) el.y = H + 300;
        if (el.y > H + 300) el.y = -300;
      }
      drawElement(el);
    });
  }

  if (phase !== "result") {
    requestAnimationFrame(loop);
  }
}

function drawElement(el) {
  ctx.save();
  ctx.translate(el.x, el.y);
  ctx.rotate(el.angle);

  const s = el.size || 180;
  const half = s / 2;

  if (el.img && el.img.complete && el.img.naturalWidth !== 0) {
    ctx.drawImage(el.img, -half, -half, s, s);
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, half, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${s * 0.45}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(el.name, 0, 0);
  }
  ctx.restore();
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function attractParticlesToBody(pose) {
  let targetCenters = [];
  if (pose && pose.length >= 33) {
    pose.forEach(pt => {
      targetCenters.push({ x: (1 - pt.x) * W, y: pt.y * H });
    });

    for (let i = 0; i < pose.length - 1; i++) {
      const p1 = pose[i];
      const p2 = pose[i+1];
      for (let step = 1; step <= 3; step++) {
        const t = step / 4;
        targetCenters.push({
          x: (1 - (p1.x * (1 - t) + p2.x * t)) * W,
          y: (p1.y * (1 - t) + p2.y * t) * H
        });
      }
    }
  } else {
    for (let i = 0; i < 80; i++) {
      targetCenters.push({ 
        x: W / 2 + (Math.random() - 0.5) * 400, 
        y: H / 2 + (Math.random() - 0.5) * 600 
      });
    }
  }

  elements.forEach((el, index) => {
    el.startX = el.x;
    el.startY = el.y;
    const target = targetCenters[index % targetCenters.length];
    
    el.targetX = target.x + (Math.random() - 0.5) * 25;
    el.targetY = target.y + (Math.random() - 0.5) * 25;
    el.startTime = performance.now();
    el.progress = 0;
  });

  function animateMagnet() {
    const now = performance.now();
    elements.forEach(el => {
      el.progress = Math.min(1, (now - el.startTime) / 600);
      const t = 1 - Math.pow(1 - el.progress, 3);
      el.x = el.startX + (el.targetX - el.startX) * t;
      el.y = el.startY + (el.targetY - el.startY) * t;
      el.angle += 0.2;
    });

    if (elements.some(el => el.progress < 1)) {
      requestAnimationFrame(animateMagnet);
    }
  }
  animateMagnet();
}

function calculateAttributes(pose) {
  const values = pose || [];
  const scores = baseElementsInfo.map((el, i) => ({ index: i, score: Math.random() * 20 }));

  if (values.length >= 33) {
    const leftWrist = values[15];
    const rightWrist = values[16];
    const leftShoulder = values[11];
    const rightShoulder = values[12];
    const leftHip = values[23];
    const rightHip = values[24];

    const armSpan = Math.abs(leftWrist.x - rightWrist.x);
    const handHeight = (leftWrist.y + rightWrist.y) / 2;
    const shoulderHeight = (leftShoulder.y + rightShoulder.y) / 2;
    const bodyWidth = Math.abs(leftHip.x - rightHip.x);

    scores[0].score += Math.max(0, (shoulderHeight - handHeight) * 80);
    scores[1].score += (1 - handHeight) * 30;
    scores[2].score += bodyWidth * 40;
    scores[3].score += armSpan * 50;
    scores[4].score += (leftWrist.y - leftShoulder.y) * 40;
    scores[5].score += Math.max(0, (rightWrist.y - rightShoulder.y) * 60);
    scores[6].score += Math.abs(leftWrist.x - rightWrist.x) * 60;
    scores[7].score += Math.abs(leftWrist.x - leftShoulder.x) * 50;
  }

  return scores.sort((a, b) => b.score - a.score);
}

function showResult() {
  const idCanvas = document.createElement("canvas");
  idCanvas.width = 300;
  idCanvas.height = 380;
  const ictx = idCanvas.getContext("2d");

  ictx.save();
  ictx.translate(300, 0);
  ictx.scale(-1, 1);

  const sourceImage = frozenVideoSnapshot || video;

  if (latestFaceBox) {
    const cx = latestFaceBox.x + latestFaceBox.w / 2;
    const cy = latestFaceBox.y + latestFaceBox.h / 2;
    const cropW = latestFaceBox.w * 2.2;
    const cropH = cropW * (380 / 300);
    const sx = Math.max(0, cx - cropW / 2);
    const sy = Math.max(0, latestFaceBox.y - latestFaceBox.h * 0.8);

    ictx.drawImage(sourceImage, sx, sy, cropW, cropH, 0, 0, 300, 380);
  } else {
    ictx.drawImage(sourceImage, (W - 300) / 2, (H - 380) / 2, 300, 380, 0, 0, 300, 380);
  }
  ictx.restore();

  const avatarDataUrl = idCanvas.toDataURL("image/png");
  document.getElementById("resultAvatar").src = avatarDataUrl;

  const sorted = calculateAttributes(capturedPose);
  const best = baseElementsInfo[sorted[0].index];

  // 設定超大屬性標誌圖片與名稱
  document.getElementById("attributeBadgeImg").src = best.path;
  document.getElementById("attributeBadgeText").textContent = best.name;
  document.getElementById("resultDesc").textContent = best.desc;

  // 顯示 HTML 結算視窗（全白背景）
  document.getElementById("result").style.display = "flex";
  setStatus("覺醒完成");

  // 10秒後自動返回重置系統
  let timeLeft = 10;
  const countdownEl = document.getElementById("countdownTip");
  countdownEl.textContent = `畫面將於 ${timeLeft} 秒後自動返回...`;

  if (autoResetTimer) clearInterval(autoResetTimer);
  autoResetTimer = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = `畫面將於 ${timeLeft} 秒後自動返回...`;
    if (timeLeft <= 0) {
      clearInterval(autoResetTimer);
      restartSystemToBeginning();
    }
  }, 1000);
}

window.restartSystemToBeginning = function() {
  if (autoResetTimer) clearInterval(autoResetTimer);
  document.getElementById("result").style.display = "none";
  floatingStartTime = null;
  capturedPose = null;
  latestFaceBox = null;
  frozenVideoSnapshot = null;
  holdStartTime = null;
  pauseStartTime = null;
  initParticles();

  document.getElementById("previewContainer").style.display = "block";

  phase = "intro";
  if (introTimer) clearInterval(introTimer);
  introTimer = setInterval(() => {
    currentIntroIndex = (currentIntroIndex + 1) % baseElementsInfo.length;
  }, 100);

  requestAnimationFrame(loop);
};
</script>
