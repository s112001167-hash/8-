<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR FORM - 元素覺醒</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}

#video {
  display: none;
}

/* 控制面板 */
#controlPanel {
  position: fixed;
  z-index: 10;
  top: 20px;
  left: 20px;
}

button {
  padding: 12px 24px;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  font-weight: 600;
  font-size: 15px;
  backdrop-filter: blur(5px);
  transition: all 0.2s;
}

button:hover { background: rgba(255, 255, 255, 0.3); }

/* 狀態提示 */
#status {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  letter-spacing: 3px;
  text-align: center;
  width: 90%;
  pointer-events: none;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  background: rgba(0, 0, 0, 0.7);
  padding: 14px 30px;
  border-radius: 40px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
}

/* 結算畫面：長方形證件照、放大版字體、無外框 */
#result {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.96);
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(15px);
}

.result-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 440px;
  animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeIn {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* 標準長方形證件照比例（無外框） */
.id-photo-container {
  width: 180px;
  height: 230px;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 24px;
  background: #111;
  box-shadow: 0 10px 40px rgba(255,255,255,0.15);
}

.id-photo-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(130%) brightness(95%);
}

.result-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 3px;
  margin-bottom: 14px;
  color: #fff;
}

.result-desc {
  font-size: 16px;
  color: #aaa;
  line-height: 1.6;
  margin-bottom: 25px;
  padding: 0 20px;
}

.restart-tip {
  font-size: 14px;
  color: #888;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<!-- 控制面板 -->
<div id="controlPanel">
  <button onclick="startSystem()">啟動系統</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="status">請點擊「啟動系統」開始</div>

<!-- 結算畫面 -->
<div id="result">
  <div class="result-content">
    <div class="id-photo-container">
      <img id="resultAvatar" alt="ID Photo">
    </div>
    <div class="result-title" id="resultName">屬性：--</div>
    <div class="result-desc" id="resultDesc">正在解析...</div>
    <div class="restart-tip">請對著鏡頭比出讚的手勢即可返回首頁</div>
  </div>
</div>

<script type="module">
import {
  FilesetResolver,
  FaceLandmarker,
  PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");

// ==================================================
// 八個基礎元素設定
// ==================================================
const baseElementsInfo = [
  { name: "天", desc: "至高意志與無垠蒼穹，具備統御大局的宏觀視野。", path: "images/天.png" },
  { name: "地", desc: "沉穩厚重與堅毅本質，擁有最強大的防守與包容力。", path: "images/地.png" },
  { name: "山", desc: "不動如山與堅定不移，意志力如磐石般不可動搖。", path: "images/山.png" },
  { name: "澤", desc: "滋潤萬物與靈活應變，擁有極佳的溝通與環境適應力。", path: "images/澤.png" },
  { name: "水", desc: "上善若水與深邃智慧，動靜自如、海納百川。", path: "images/水.png" },
  { name: "火", desc: "狂熱爆發與光明希望，擁有無與倫比的強大行動力。", path: "images/火.png" },
  { name: "雷", desc: "迅雷不及掩耳的決斷與破壞力，直覺敏銳果決。", path: "images/雷.png" },
  { name: "風", desc: "自由無拘與疾速變化，思維靈敏且飄忽不定。", path: "images/風.png" }
];

baseElementsInfo.forEach(el => {
  const img = new Image();
  img.src = el.path;
  img.onload = () => { el.img = img; };
});

// ==================================================
// 建立 80 個超大量標誌粒子
// ==================================================
let elements = [];
let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

function initParticles() {
  elements = [];
  baseElementsInfo.forEach(info => {
    for (let i = 0; i < 10; i++) {
      elements.push({
        name: info.name,
        desc: info.desc,
        img: info.img,
        size: 180,
        x: Math.random() * (W + 400) - 200,
        y: Math.random() * (H + 400) - 200,
        angle: Math.random() * Math.PI * 2,
        speedX: (Math.random() - 0.5) * 12,
        speedY: (Math.random() - 0.5) * 12,
        rotation: (Math.random() - 0.5) * 0.08,
        progress: 0
      });
    }
  });
}
initParticles();

window.addEventListener("resize", () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// ==================================================
// 系統狀態變數
// ==================================================
let faceLandmarker;
let poseLandmarker;
let cameraStream;
let phase = "idle";
let introTimer = null;
let currentIntroIndex = 0;
let okStartTime = null;
let poseStartTime = null;
let holdStartTime = null;
let thumbsUpStartTime = null;
let capturedPose = null;
let frozenVideoSnapshot = null;
let latestFaceBox = null;
let isAiLoaded = false;

async function loadAI() {
  if (isAiLoaded) return;
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  isAiLoaded = true;
}

window.startSystem = async function() {
  try {
    document.getElementById("controlPanel").style.display = "none";
    setStatus("系統載入中...");
    await loadAI();
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: 1280, height: 720 },
      audio: false
    });
    video.srcObject = cameraStream;
    await video.play();

    phase = "intro";
    if (introTimer) clearInterval(introTimer);
    introTimer = setInterval(() => {
      currentIntroIndex = (currentIntroIndex + 1) % baseElementsInfo.length;
    }, 100);

    requestAnimationFrame(loop);
  } catch (error) {
    alert("攝影機啟動失敗：" + error.message);
    document.getElementById("controlPanel").style.display = "block";
    setStatus("請點擊「啟動系統」開始");
  }
};

function isOkGesture(pose) {
  if (!pose || pose.length < 33) return false;
  const rightWrist = pose[16];
  const nose = pose[0];
  const dist = Math.abs(rightWrist.x - nose.x) + Math.abs(rightWrist.y - nose.y);
  return dist < 0.35;
}

function isThumbsUp(pose) {
  if (!pose || pose.length < 33) return false;
  const rightWrist = pose[16];
  const rightShoulder = pose[12];
  return rightWrist.y < rightShoulder.y;
}

// ==================================================
// 主繪製迴圈
// ==================================================
function loop() {
  ctx.clearRect(0, 0, W, H);

  let pose = null;
  if (video.readyState >= 2 && isAiLoaded) {
    try {
      const now = performance.now();
      const faceResult = faceLandmarker.detectForVideo(video, now);
      if (faceResult?.faceLandmarks?.length > 0) {
        const face = faceResult.faceLandmarks[0];
        let minX = 1, maxX = 0, minY = 1, maxY = 0;
        face.forEach(pt => {
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.y > maxY) maxY = pt.y;
        });
        latestFaceBox = {
          x: (1 - maxX) * W,
          y: minY * H,
          w: (maxX - minX) * W,
          h: (maxY - minY) * H
        };
      }

      const poseResult = poseLandmarker.detectForVideo(video, now);
      if (poseResult?.landmarks?.length > 0) pose = poseResult.landmarks[0];
    } catch (e) {
      console.error(e);
    }
  }

  // 1. 開場快轉閃爍標誌階段
  if (phase === "intro") {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    setStatus("請對著鏡頭比出 OK 手勢以開始共鳴...");

    ctx.save();
    ctx.translate(W / 2, H / 2);
    const currentAttr = baseElementsInfo[currentIntroIndex];
    
    if (currentAttr.img && currentAttr.img.complete) {
      ctx.drawImage(currentAttr.img, -200, -200, 400, 400);
    } else {
      ctx.fillStyle = "#000000";
      ctx.font = "bold 160px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(currentAttr.name, 0, 0);
    }
    ctx.restore();

    if (isOkGesture(pose)) {
      if (!okStartTime) okStartTime = Date.now();
      const remain = 2 - (Date.now() - okStartTime) / 1000;
      if (remain <= 0) {
        if (introTimer) clearInterval(introTimer);
        phase = "posing"; // 進入隨意擺姿勢階段（此時相機保持動態）
        poseStartTime = Date.now();
        okStartTime = null;
      } else {
        setStatus(`偵測到 OK 手勢，保持穩定... ${Math.ceil(remain)}s`);
      }
    } else {
      okStartTime = null;
    }

    requestAnimationFrame(loop);
    return;
  }

  // 2. 判斷背景是要渲染動態相機畫面還是暫停畫面
  if (phase === "posing" || phase === "intro") {
    // 擺姿勢階段：相機保持動態即時串流
    if (video.readyState >= 2) {
      ctx.save();
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, W, H);
      ctx.restore();
      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.fillRect(0, 0, W, H);
    }
  } else if (frozenVideoSnapshot) {
    // 元素聚集並停留展示階段：渲染暫停（定格）畫面
    ctx.drawImage(frozenVideoSnapshot, 0, 0, W, H);
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    ctx.fillRect(0, 0, W, H);
  }

  // 階段：隨意擺姿勢 3 秒（相機正常動態運作）
  if (phase === "posing") {
    const remain = 3 - (Date.now() - poseStartTime) / 1000;
    setStatus(`請隨意擺出姿勢！ ${Math.max(0, Math.ceil(remain))}s`);
    if (remain <= 0) {
      capturedPose = pose;
      
      // 在 3 秒結束、準備磁吸聚集的「瞬間」，立刻截取並暫停相機畫面
      const snap = document.createElement("canvas");
      snap.width = W;
      snap.height = H;
      const sctx = snap.getContext("2d");
      sctx.save();
      sctx.translate(W, 0);
      sctx.scale(-1, 1);
      sctx.drawImage(video, 0, 0, W, H);
      sctx.restore();
      frozenVideoSnapshot = snap;

      attractParticlesToBody(pose);
      phase = "flying";
    }
  }

  // 階段：磁鐵包覆並在畫面上「暫停停留展示」2.5 秒
  if (phase === "flying") {
    setStatus("元素融合中...");
    const finished = elements.every(el => el.progress >= 1);
    if (finished) {
      if (!holdStartTime) holdStartTime = Date.now();
      const holdRemain = 2.5 - (Date.now() - holdStartTime) / 1000;
      if (holdRemain <= 0) {
        phase = "result";
        holdStartTime = null;
        showResult();
      }
    }
  }

  // 階段：結果畫面（此時才允許比讚返回首頁）
  if (phase === "result") {
    if (isThumbsUp(pose)) {
      if (!thumbsUpStartTime) thumbsUpStartTime = Date.now();
      const upRemain = 1.5 - (Date.now() - thumbsUpStartTime) / 1000;
      if (upRemain <= 0) {
        thumbsUpStartTime = null;
        restartSystemToIntro();
      } else {
        setStatus(`偵測到比讚，即將返回首頁... ${Math.ceil(upRemain)}s`);
      }
    } else {
      thumbsUpStartTime = null;
      setStatus("覺醒完成");
    }
  }

  // 飄動與磁吸粒子更新
  elements.forEach(el => {
    const matched = baseElementsInfo.find(b => b.name === el.name);
    if (matched && matched.img) el.img = matched.img;

    if (phase === "posing") {
      el.x += el.speedX;
      el.y += el.speedY;
      el.angle += el.rotation;

      if (el.x < -300) el.x = W + 300;
      if (el.x > W + 300) el.x = -300;
      if (el.y < -300) el.y = H + 300;
      if (el.y > H + 300) el.y = -300;
    }
    drawElement(el);
  });

  requestAnimationFrame(loop);
}

function drawElement(el) {
  ctx.save();
  ctx.translate(el.x, el.y);
  ctx.rotate(el.angle);

  const s = el.size || 180;
  const half = s / 2;

  if (el.img && el.img.complete) {
    ctx.drawImage(el.img, -half, -half, s, s);
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, half, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${s * 0.45}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(el.name, 0, 0);
  }
  ctx.restore();
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

// ==================================================
// 完美貼合人體形狀的磁鐵吸附演算法
// ==================================================
function attractParticlesToBody(pose) {
  let targetCenters = [];
  if (pose && pose.length >= 33) {
    pose.forEach(pt => {
      targetCenters.push({ x: (1 - pt.x) * W, y: pt.y * H });
    });

    for (let i = 0; i < pose.length - 1; i++) {
      const p1 = pose[i];
      const p2 = pose[i+1];
      for (let step = 1; step <= 3; step++) {
        const t = step / 4;
        targetCenters.push({
          x: (1 - (p1.x * (1 - t) + p2.x * t)) * W,
          y: (p1.y * (1 - t) + p2.y * t) * H
        });
      }
    }
  } else {
    for (let i = 0; i < 80; i++) {
      targetCenters.push({ 
        x: W / 2 + (Math.random() - 0.5) * 400, 
        y: H / 2 + (Math.random() - 0.5) * 600 
      });
    }
  }

  elements.forEach((el, index) => {
    el.startX = el.x;
    el.startY = el.y;
    const target = targetCenters[index % targetCenters.length];
    
    el.targetX = target.x + (Math.random() - 0.5) * 25;
    el.targetY = target.y + (Math.random() - 0.5) * 25;
    el.startTime = performance.now();
    el.progress = 0;
  });

  function animateMagnet() {
    const now = performance.now();
    elements.forEach(el => {
      el.progress = Math.min(1, (now - el.startTime) / 600);
      const t = 1 - Math.pow(1 - el.progress, 3);
      el.x = el.startX + (el.targetX - el.startX) * t;
      el.y = el.startY + (el.targetY - el.startY) * t;
      el.angle += 0.2;
    });

    if (elements.some(el => el.progress < 1)) {
      requestAnimationFrame(animateMagnet);
    }
  }
  animateMagnet();
}

// ==================================================
// 屬性計算
// ==================================================
function calculateAttributes(pose) {
  const values = pose || [];
  const scores = baseElementsInfo.map((el, i) => ({ index: i, score: Math.random() * 20 }));

  if (values.length >= 33) {
    const leftWrist = values[15];
    const rightWrist = values[16];
    const leftShoulder = values[11];
    const rightShoulder = values[12];
    const leftHip = values[23];
    const rightHip = values[24];

    const armSpan = Math.abs(leftWrist.x - rightWrist.x);
    const handHeight = (leftWrist.y + rightWrist.y) / 2;
    const shoulderHeight = (leftShoulder.y + rightShoulder.y) / 2;
    const bodyWidth = Math.abs(leftHip.x - rightHip.x);

    scores[0].score += Math.max(0, (shoulderHeight - handHeight) * 80);
    scores[1].score += (1 - handHeight) * 30;
    scores[2].score += bodyWidth * 40;
    scores[3].score += armSpan * 50;
    scores[4].score += (leftWrist.y - leftShoulder.y) * 40;
    scores[5].score += Math.max(0, (rightWrist.y - rightShoulder.y) * 60);
    scores[6].score += Math.abs(leftWrist.x - rightWrist.x) * 60;
    scores[7].score += Math.abs(leftWrist.x - leftShoulder.x) * 50;
  }

  return scores.sort((a, b) => b.score - a.score);
}

// ==================================================
// 顯示結算畫面
// ==================================================
function showResult() {
  const idCanvas = document.createElement("canvas");
  idCanvas.width = 300;
  idCanvas.height = 380;
  const ictx = idCanvas.getContext("2d");

  ictx.save();
  ictx.translate(300, 0);
  ictx.scale(-1, 1);

  const sourceImage = frozenVideoSnapshot || video;

  if (latestFaceBox) {
    const cx = latestFaceBox.x + latestFaceBox.w / 2;
    const cy = latestFaceBox.y + latestFaceBox.h / 2;
    const cropW = latestFaceBox.w * 2.2;
    const cropH = cropW * (380 / 300);
    const sx = Math.max(0, cx - cropW / 2);
    const sy = Math.max(0, latestFaceBox.y - latestFaceBox.h * 0.8);

    ictx.drawImage(sourceImage, sx, sy, cropW, cropH, 0, 0, 300, 380);
  } else {
    ictx.drawImage(sourceImage, (W - 300) / 2, (H - 380) / 2, 300, 380, 0, 0, 300, 380);
  }
  ictx.restore();

  document.getElementById("resultAvatar").src = idCanvas.toDataURL("image/png");

  const sorted = calculateAttributes(capturedPose);
  const best = baseElementsInfo[sorted[0].index];

  document.getElementById("resultName").textContent = `主屬性：${best.name}`;
  document.getElementById("resultDesc").textContent = best.desc;

  document.getElementById("result").style.display = "flex";
  setStatus("覺醒完成");
}

// 返回首頁快轉標誌
window.restartSystemToIntro = function() {
  document.getElementById("result").style.display = "none";
  okStartTime = null;
  capturedPose = null;
  latestFaceBox = null;
  frozenVideoSnapshot = null;
  holdStartTime = null;
  thumbsUpStartTime = null;
  initParticles();

  phase = "intro";
  if (introTimer) clearInterval(introTimer);
  introTimer = setInterval(() => {
    currentIntroIndex = (currentIntroIndex + 1) % baseElementsInfo.length;
  }, 100);
};
</script>

</body>
</html>
